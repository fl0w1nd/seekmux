    <title>SeekMux</title>
    <script>
      // Apply the saved theme before first paint.
      try {
        const t = localStorage.getItem("seekmux-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
