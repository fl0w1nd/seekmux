name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    paths-ignore: &ci-skip-paths
      # Files this workflow does not validate. Keep ci.yml, mise.toml,
      # mise.lock, Dockerfile and .dockerignore out of this list.
      - "*.md"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - "docker-compose.yml"
      - "scripts/release-notes.sh"
      - ".github/workflows/release.yml"
  pull_request:
    paths-ignore: *ci-skip-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Every job gets Go, Node.js and pnpm from mise.toml at the versions in
# mise.lock, and runs the same mise tasks as a local checkout.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('mise.lock', 'go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-

      - name: Lint
        run: mise run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('mise.lock', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      - name: Run Go tests with coverage
        run: mise run cover

  race:
    name: Race detector
    # The slowest job; skip it for pushes to side branches.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('mise.lock', 'go.sum') }}
          restore-keys: go-race-${{ runner.os }}-

      - name: Run Go tests with the race detector
        run: mise run test:race

  build:
    name: Build validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('mise.lock', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-

      - name: Build console and server binary
        run: mise run build

  container:
    name: Container validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse --short=12 HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: seekmux:ci
          build-args: |
            VERSION=ci-${{ steps.metadata.outputs.commit }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container

      - name: Smoke-test container
        shell: bash
        run: scripts/smoke-container.sh seekmux:ci
